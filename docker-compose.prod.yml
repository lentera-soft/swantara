services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: swantara
      POSTGRES_USER: swantara_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swantara_app -d swantara"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfs_data:/data/rustfs0
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: service/Dockerfile
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://swantara_app:${POSTGRES_PASSWORD:-password_app}@postgres:5432/swantara
      GOOSE_TABLE: goose_migrations
    command: ["./goose", "-dir", "/app/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: service/Dockerfile
    restart: unless-stopped
    command: ["./http"]
    env_file:
      - path: service/.env
        required: false
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: swantara_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password_app}
      DB_NAME: swantara
      QUEUE_REDIS_HOST: valkey
      QUEUE_REDIS_PORT: "6379"
      STORAGE_PATH: /app/storage
      STORAGE_PROVIDER: rustfs
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_BUCKET: ${RUSTFS_BUCKET:-swantara}
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      STORAGE_REGION: us-east-1
      STORAGE_USE_PATH_STYLE: "true"
    expose:
      - "8080"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue-worker:
    build:
      context: .
      dockerfile: service/Dockerfile
    restart: unless-stopped
    command: ["./queue"]
    env_file:
      - path: service/.env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: swantara_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password_app}
      DB_NAME: swantara
      QUEUE_REDIS_HOST: valkey
      QUEUE_REDIS_PORT: "6379"
      STORAGE_PATH: /app/storage
      STORAGE_PROVIDER: rustfs
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_BUCKET: ${RUSTFS_BUCKET:-swantara}
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      STORAGE_REGION: us-east-1
      STORAGE_USE_PATH_STYLE: "true"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      SWANTARA_API_URL: http://api:8080/api/v1
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs_data:
  storage_data:
  caddy_data:
  caddy_config:
