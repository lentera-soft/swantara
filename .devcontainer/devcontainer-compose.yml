services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: swantara/dev:latest
    hostname: swantara
    command: sleep infinity
    volumes:
      - .:/workspace:cached
    environment:
      - NODE_ENV=development
      - SWANTARA_API_URL=http://api:8080/api/v1
    ports:
      - "3000:3000"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swantara
      POSTGRES_USER: swantara_app
      POSTGRES_PASSWORD: password_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swantara_app -d swantara"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
